[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vagalens"
version = "0.0.1"
description = "Local-first RAG pipeline that screens internship postings and drafts grounded cover letters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy dependencies, only needed once indexing/retrieval lands (v0.1).
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
vagalens = "vagalens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vagalens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
